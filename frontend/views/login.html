<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — SoporteNet</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-marca">
            <div class="auth-marca-contenido">
                <img src="../css/logo.png" alt="SoporteNet" class="auth-logo">
                <p class="auth-categoria">Soporte Técnico · Internet ISP</p>
                <h2>SoporteNet</h2>
                <p>Del primer reporte a la solución confirmada, sin perder el hilo de ningún ticket.</p>
            </div>
        </div>

        <div class="auth-formulario">
            <div class="tarjeta tarjeta-login">
                <h1>Iniciar sesión</h1>
                <p class="subtitulo">Ingresa con tu correo y contraseña</p>

                <div id="mensaje-error" class="mensaje-error oculto"></div>

                <form id="form-login">
                    <div class="campo">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" required autocomplete="username">
                    </div>
                    <div class="campo">
                        <label for="contrasena">Contraseña</label>
                        <div class="campo-con-icono">
                            <input type="password" id="contrasena" required autocomplete="current-password">
                            <button type="button" class="alternar-contrasena" data-target="contrasena" aria-label="Mostrar contraseña"></button>
                        </div>
                        <p style="margin: 6px 0 0; text-align: right;"><a href="recuperar.html" style="font-size: 0.82rem;">¿Olvidaste tu contraseña?</a></p>
                    </div>
                    <button type="submit" id="btn-login" style="width: 100%; justify-content: center;">Iniciar sesión</button>
                </form>

                <p style="text-align: center; margin-bottom: 0; margin-top: 18px; font-size: 0.85rem; color: var(--color-texto-suave);">
                    ¿Tienes un token de invitación? <a href="activar.html">Activa tu cuenta</a>
                </p>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>

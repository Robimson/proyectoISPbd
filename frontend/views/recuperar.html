<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña — SoporteNet</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-marca">
            <div class="auth-marca-contenido">
                <img src="../css/logo.png" alt="SoporteNet" class="auth-logo logo-negocio">
                <p class="auth-categoria categoria-negocio-texto">Soporte Técnico · Internet ISP</p>
                <h2 class="nombre-negocio-texto">SoporteNet</h2>
                <p>Te ayudamos a recuperar el acceso a tu cuenta.</p>
            </div>
        </div>

        <div class="auth-formulario">
            <div class="tarjeta tarjeta-login">
                <h1>Recuperar contraseña</h1>
                <p class="subtitulo">Escribe tu correo y te mandamos un enlace para restablecerla</p>

                <div id="mensaje-error" class="mensaje-error oculto"></div>
                <div id="mensaje-exito" class="mensaje-info oculto"></div>

                <form id="form-recuperar">
                    <div class="campo">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" required autocomplete="username">
                    </div>
                    <button type="submit" id="btn-recuperar" style="width: 100%; justify-content: center;">Enviar enlace</button>
                </form>

                <p style="text-align: center; margin-bottom: 0; margin-top: 18px; font-size: 0.85rem; color: var(--color-texto-suave);">
                    <a href="login.html">Volver a iniciar sesión</a>
                </p>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/recuperar.js"></script>
</body>
</html>
